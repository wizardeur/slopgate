name: slopgate
on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Self-hosted: this repo is gated by the action defined in the same PR.
      - uses: ./
        with:
          base_branch: main
          fail_on_slop: 'true'
          post_pr_comment: 'true'
          auto_polish: 'false'
